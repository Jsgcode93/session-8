<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieDB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
<!--Navbar placeholder-->
<span id="navbar-placeholder"></span>

 <!-- Main page content--> 
  <main class="container"> 
 <!-- Page Header-->   
  <h1>&#127916; Movie DB &#127909;</h1>
  <!--Section for search and sort-->
     <section class="search-sort">
       <h2>Movie Search / sort </h2>
       <form id="form-list-control">
        <div class="mb-3">      
            <input type="text" placeholder="Movie-name" id="search-string">
          </div>
<!--Buttons to run search and sort function-->
   <div class="mb-3">
    <button type="button" name="btn-search" id="searchBtn">Search</button>
    <button type="button" name="btn-a2z" id="sortA2ZBtn">Sort (A-Z)</button>
    <button type="button" name="btn-z2a" id="sortZ2ABtn">Sort (Z-A)</button>
   </div>
   </form>
 </section>
<!--End search and sort section-->

<!--Start movie list section-->
<section id="mList">                                    
  <h2 class ="ml-3">Movie List</h2>

<!--Movie List start-->
    <ol class="list" id="list">
    <li class="row">the redemption(1994)</li>
    <li class="row">The Matrix (1999)</li>
    <li class="row">SAW 1 (2002)</li>
    <li class="row">Face Off (1999) </li>
    <li class="row">Terminator (2000)</li>
    <li class="row">Drag me to hell (2011)</li>
    <li class="row">Bad boys 2 (2008)  </li>
    <li class="row">Get rich or die trying (2005)</li>
    </ol>  
<!--End movie list section -->
</section>  
<!--Send move list section -->

<!--section to display message-->
 <section id="msg" class="msgBox"></section>

<!--start tab section-->
<!--tabs--> 
<section class="tab">
      <button class="tablinks" onclick="openForm(event, 'Add')" id="defaultOpen">Add a New Movie</button>
      <button class="tablinks" onclick="openForm(event, 'Update')">Update a Movie</button>
      <button class="tablinks"onclick="openForm(event, 'Delete')">Delete a Movie</button>
</section>
 <!--End of tab section-->



<!--footer-->
<footer>
    <div>
        <p>Copyright &copy; <span id="date"></span>my movie app</p>
    </div>
</footer>
<!--load in our Javascript-->
 <!--the order we import the JS here is important-->
 <!--have the movie list first, allows app.js to access the class defined in this file -->
<script src="./js/Movie-list.js"></script>
<!--app.js file-->
<script src="./js/app.js"></script>
 <!--Navbar Script-->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>
<!--Bootstrap Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    
</body>           
</html>
