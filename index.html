<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie App</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
 <!-- Main page content--> 
  <main class="container"> 
 <!-- Page Header-->   
  <h1>My move app</h1>
  <!--Section for search and sort-->
     <section class="search-sort">
       <h2>Movie Search / sort </h2>
       <form id="form-list-control">
        <div class="mb-3">      
            <input type="text" placeholder="Movie-name" id="search-string">
          </div>
<!--Buttons to run search and sort function-->
   <div class="mb3">
    <button type="button" name="btn-search" id="SearchBtn">Search</button>
    <button type="button" name="btn-a2z" id="sortA2ZBtn">Sort (A-Z)</button>
    <button type="button" name="btn-z2a" id="SortZ2ABtn">Sort (Z-A)</button>
   </div>
   </form>
    </section>
<!--End search and sort section-->
    <section id="mList">                                    
     <h2 class ="ml-3">Movie List</h2>

    </section>
<!--Send move list section -->

<!--section to display message-->
   <section id="msg" class="msgBox"></section>

   <!--start tab section-->
   <!--tabs--> 
    <section class="tabs">  

    </section>
 <!--End of tab section-->

 <!--Tab content --> 
<section id="add" class="tabcontent">       
   <h2> add a movie </h2>
</section>
<!--End add movie-->
<!--Update movie section -->
<section id="update" class="tabcontent">
    <h2> update a movie <h2>  
</section>
<!--End update section-->
<!--delete movie section-->
<section id="delete" class="tabcontent">       
 <h2> delete movie section </h2>
</section>
<!--end delete movie section-->

<!--footer-->
<footer>
    <div>
        <p>Copyright &copy; <span id="date"></span>my movie app</p>
    </div>
</footer>

<!--load in our Javascript-->
 <!--the order we import the JS here is important-->
 <!--have the movie list first, allows app.js to access the class defined in this file -->
<script src="./js/movie-link.js"></script>
<script src="./js/app.js"></script>
</body>           
</html>
