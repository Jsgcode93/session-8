<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie DB</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- Navbar placeholder -->
    <span id="navbar-placeholder"></span>

    <!-- Main page content -->
<main class="container my-4"> 
    <h1>🎬 Movie DB 🎥</h1>
 
    <!-- Visible Movie List Container -->
    <section id="mList" class="mb-4">
        <h2>All Movies</h2>
        <ol class="list" id="list"></ol>
    </section>

    <!-- Section to display success/error messages -->
    <section id="msg" class="msgBox mb-4" style="display: none;"></section>
</main>
    <!-- Footer -->
    <footer class="text-center py-3">
        <div>
            <p>Copyright &copy; <span id="date"></span> Movie DB</p>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="./js/Movie-list.js"></script>
    <script src="./js/app.js"></script>

    <!-- Navbar Script -->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>
    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>    
</body>          
</html>
