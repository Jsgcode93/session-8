<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<span id="navbar-placeholder"></span>
 <!-- Main page content--> 
  <main class="container"> 
 <!-- Page Header-->   
  <h1>&#127916; Movie DB &#127909;</h1>

<!-- Live Movie List -->
        <section id="mList" class="mb-4">                                    
            <h2 class="ml-3">Movie List</h2>
            <ol class="list" id="list">
            </ol>  
        </section>

<!--tabs--> 
<section class="tab">
      <button class="tablinks" onclick="openForm(event, 'Add')" id="defaultOpen">Add a New Movie</button>
      <button class="tablinks" onclick="openForm(event, 'Update')">Update a Movie</button>
      <button class="tablinks"onclick="openForm(event, 'Delete')">Delete a Movie</button>
</section>
 <!--End of tab section-->

<!-- Add Movie Section -->
        <section id="Add" class="tabcontent">        
            <h2>Add a Movie</h2>
            <form id="form-add">
                <div class="mb-3">
                    <label for="addTitle">Title: </label>
                    <input type="text" placeholder="Title..." name="title" id="addTitle">
                </div>
                <div class="mb-3">
                    <label for="addYear">Year: </label>
                    <input type="text" placeholder="Year..." name="year" id="addYear">
                </div>
                <button type="button" name="submit" id="addSubmit">Add Movie</button>
            </form>
        </section>

<!--Update movie section -->
    <section id="Update" class="tabcontent">
      <h2>Update a Movie</h2>
      <form id="form-update">
        <div class="mb-3">
          <label for="upIndex">Index: </label>
          <input type="text" placeholder="Index..." name="index" id="upIndex">
        </div>
        <div class="mb-3">
          <label for="upTitle">Title: </label>
          <input type="text" placeholder="Title..." name="title" id="upTitle">
        </div>
        <div class="mb-3">
          <label for="upYear">Year: </label>
          <input type="text" placeholder="Year..." name="year" id="upYear">
        </div>
        <button type="button" name="submit" id="updateSubmit">Update Movie</button>
      </form>
    </section>
<!--End update section-->

<!--Delete movie-->
<section id="Delete" class="tabcontent card p-4 mb-4 shadow-sm" style="display: none;">    
            <h3 class="h4 mb-3">Delete a Movie</h3>
            <form id="form-delete">
                <div class="mb-3">
                    <label for="delIndex" class="form-label">Movie Index / ID</label>
                    <input type="number" class="form-control" placeholder="Index to delete..." name="index" id="delIndex" required>
                </div>
                <button type="button" class="btn btn-danger" id="deleteSubmit">Delete Movie</button>
            </form>
        </section>
    </main>  
<!-- End delete movie -->
 <!-- JavaScript Files -->
    <script src="./js/Movie-list.js"></script>
    <script src="./js/app.js"></script>

  <!--Navbar Script-->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>
<!--Bootstrap Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>   
</body>
</html>
