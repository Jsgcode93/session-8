<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
<!--Navbar placeholder-->
<span id="navbar-placeholder"></span>

 <!-- Main page content--> 
  <main class="container"> 
 <!-- Page Header-->   
  <h1>&#127916; Movie DB &#127909;</h1>


  <main class="container">
    <section class="search-sort mb-4">
      <h2>Movie Search / Sort</h2>
      <form id="form-list-control">
        <div class="mb-3">      
          <input type="text" placeholder="Movie title..." id="search-string">
        </div>
        <div class="mb-3">
          <button type="button" id="searchBtn">Search</button>
          <button type="button" id="sortA2ZBtn">Sort (A-Z)</button>
          <button type="button" id="sortZ2ABtn">Sort (Z-A)</button>
        </div>
      </form>
    </section>

<!--End search and sort section-->
<script src="./js/Movie-list.js"></script>
<!--app.js file-->
<script src="./js/app.js"></script>
 <!--Navbar Script-->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>
<!--Bootstrap Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>   
</body>
</html>
