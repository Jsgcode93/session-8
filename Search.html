<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Sort - Movie DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Navbar placeholder -->
    <span id="navbar-placeholder"></span>

    <!-- Main page content --> 
    <main class="container my-4"> 
        <!-- Page Header -->   
        <h1 class="mb-4">🎬 Movie DB</h1>

        <!-- Section for search and sort -->
        <section class="search-sort mb-4">
            <h2>Movie Search &amp; Sort</h2>
            <form id="form-list-control">
                <div class="mb-3">      
                    <input type="text" class="form-control w-50" placeholder="Movie name" id="search-string">
                </div>
                <!-- Buttons to run search and sort functions -->
                <div class="mb-3">
                    <button type="button" class="btn btn-primary" name="btn-search" id="searchBtn">Search</button>
                    <button type="button" class="btn btn-secondary" name="btn-a2z" id="sortA2ZBtn">Sort (A-Z)</button>
                    <button type="button" class="btn btn-secondary" name="btn-z2a" id="sortZ2ABtn">Sort (Z-A)</button>
                </div>
            </form>
        </section>

        <!-- Dynamic Results List -->
        <section id="mList">                                    
            <h2 class="ml-3">Search Results</h2>
            <ol class="list" id="list">
                <!-- JavaScript populates movies from localStorage here -->
            </ol>  
        </section>
    </main>

    <!-- Project JavaScript Files -->
    <script src="./js/Movie-list.js"></script>
    <script src="./js/app.js"></script>

    <!-- Navbar Dynamic Loader Script -->
    <script> 
        fetch('Navbar.html')
            .then(response => response.text()) 
            .then(html => { 
                document.getElementById('navbar-placeholder').innerHTML = html;  
            })
            .catch(error => console.error('Navbar unable to load!', error));
    </script>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>   
</body>
</html>
